services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: dhet_app:latest
    env_file:
      - ${ENV_FILE:-docker-env.staging.example}
    environment:
      MODE: production
      DEBUG: "False"
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-dhet_app}
    volumes:
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    env_file:
      - ${ENV_FILE:-docker-env.staging.example}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dhet_app}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-dhet_app}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  media:
  postgres_data:
