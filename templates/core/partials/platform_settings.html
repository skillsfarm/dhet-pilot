<div class="app-card space-y-6">
    <form method="post"
          hx-post="{% url 'platform-settings' %}"
          hx-target="#tab-content"
          hx-swap="innerHTML swap:0.5s">
        {% csrf_token %}
        <div class="space-y-4">
            {% for flag in flags %}
                <div class="flex items-start justify-between gap-6 border border-border rounded-lg p-4">
                    <div>
                        <div class="text-sm font-medium text-foreground">{{ flag.name }}</div>
                        <div class="text-xs text-muted-foreground">{{ flag.key }}</div>
                        {% if flag.description %}
                            <p class="mt-2 text-sm text-muted-foreground">{{ flag.description }}</p>
                        {% endif %}
                    </div>
                    <label class="inline-flex items-center gap-2">
                        <input type="checkbox"
                               name="flag_{{ flag.key }}"
                               class="rounded border-border text-primary focus:ring-primary"
                               {% if flag.is_active %}checked{% endif %}>
                        <span class="text-sm text-muted-foreground">Enabled</span>
                    </label>
                </div>
            {% empty %}
                <div class="text-sm text-muted-foreground">No feature flags configured.</div>
            {% endfor %}
        </div>
        <div class="-mx-8 -mb-8 mt-6 px-8 py-4 bg-muted border-t border-border">
            <div class="flex items-center justify-between">
                <a href="{% url 'dashboard' %}" class="app-btn app-btn-ghost">Back</a>
                <button type="submit" class="app-btn app-btn-primary">Save Settings</button>
            </div>
        </div>
    </form>
</div>
