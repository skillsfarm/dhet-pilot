{% load role_tags %}
<div class="bg-card rounded-xl shadow-sm border border-border">
    <div class="p-6 border-b border-border">
        <form method="get" class="flex flex-col md:flex-row gap-4">
            <div class="flex-1">
                <label for="search" class="sr-only">Search</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-muted-foreground">
                        <i data-lucide="search" class="h-5 w-5"></i>
                    </div>
                    <input type="text"
                           name="q"
                           id="search"
                           class="block w-full pl-10 pr-3 py-2 bg-input border border-border rounded-lg text-foreground placeholder-muted-foreground focus:ring-primary focus:border-primary"
                           placeholder="Search industries by name..."
                           value="{{ search_query|default:'' }}">
                </div>
            </div>
            <div>
                <a href="{% url 'industry-list' %}"
                   class="inline-flex items-center px-4 py-2 border border-border text-sm font-medium rounded-lg text-muted-foreground hover:text-foreground hover:bg-muted transition-colors">
                    Clear
                </a>
            </div>
        </form>
    </div>
    <div class="divide-y divide-border">
        {% if industries %}
            {% for industry in industries %}
                <div class="group p-6 hover:bg-muted/50 transition-colors flex items-center justify-between gap-6">
                    <div>
                        <div class="flex items-center gap-2">
                            <h3 class="text-base font-semibold text-foreground">{{ industry.name }}</h3>
                            <span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-muted text-muted-foreground border border-border">
                                {{ industry.code }}
                            </span>
                        </div>
                        {% if industry.description %}
                            <p class="text-sm text-muted-foreground mt-1">{{ industry.description }}</p>
                        {% endif %}
                    </div>
                    <div class="opacity-0 group-hover:opacity-100 transition-opacity flex items-center gap-2">
                        <a href="{% url 'industry-edit' industry.id %}"
                           class="p-2 rounded-lg hover:bg-muted text-muted-foreground hover:text-foreground transition-colors"
                           title="Edit Industry">
                            <i data-lucide="pencil" class="w-4 h-4"></i>
                        </a>
                        <a href="{% url 'industry-delete' industry.id %}"
                           class="p-2 rounded-lg hover:bg-destructive/10 text-muted-foreground hover:text-destructive transition-colors"
                           title="Delete Industry">
                            <i data-lucide="trash-2" class="w-4 h-4"></i>
                        </a>
                    </div>
                </div>
            {% endfor %}
        {% else %}
            <div class="text-center py-12 text-muted-foreground">
                <i data-lucide="layers" class="mx-auto h-12 w-12 opacity-50 mb-3"></i>
                <h3 class="text-sm font-medium text-foreground">No industries found</h3>
                <p class="mt-1 text-sm">Try adjusting your search.</p>
            </div>
        {% endif %}
    </div>
</div>
