<div class="app-card p-4">
    <form method="post"
          hx-post="{% url 'occupation-media-detail' occupation.id media_item.id %}"
          hx-target="closest .app-card"
          hx-swap="outerHTML">
        {% csrf_token %}
        <div class="space-y-3">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                <div>
                    <label for="{{ form.title.id_for_label }}" class="block mb-1 text-xs text-muted-foreground">Title</label>
                    {{ form.title }}
                </div>
                <div>
                    <label for="{{ form.media_type.id_for_label }}" class="block mb-1 text-xs text-muted-foreground">Media Type</label>
                    {{ form.media_type }}
                </div>
            </div>
            <div>
                <label for="{{ form.description.id_for_label }}" class="block mb-1 text-xs text-muted-foreground">Description</label>
                {{ form.description }}
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                <div>
                    <label for="{{ form.source_type.id_for_label }}" class="block mb-1 text-xs text-muted-foreground">Source Type</label>
                    {{ form.source_type }}
                </div>
                <div>
                    <label for="{{ form.order.id_for_label }}" class="block mb-1 text-xs text-muted-foreground">Order</label>
                    {{ form.order }}
                </div>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                <div>
                    <label for="{{ form.remote_url.id_for_label }}" class="block mb-1 text-xs text-muted-foreground">Remote URL</label>
                    {{ form.remote_url }}
                </div>
                <div>
                    <label for="{{ form.local_file.id_for_label }}" class="block mb-1 text-xs text-muted-foreground">Local File</label>
                    {{ form.local_file }}
                </div>
            </div>
            <div>
                <label for="{{ form.embed_code.id_for_label }}" class="block mb-1 text-xs text-muted-foreground">Embed Code</label>
                {{ form.embed_code }}
            </div>
            <div class="flex items-center gap-4">
                <label class="inline-flex items-center gap-2">
                    {{ form.is_featured }}
                    <span class="text-xs text-muted-foreground">Featured</span>
                </label>
                <label class="inline-flex items-center gap-2">
                    {{ form.is_active }}
                    <span class="text-xs text-muted-foreground">Active</span>
                </label>
            </div>
        </div>
        <div class="mt-4 flex items-center justify-end gap-2">
            <button type="button"
                    hx-get="{% url 'occupation-media-detail' occupation.id media_item.id %}"
                    hx-target="closest .app-card"
                    hx-swap="outerHTML"
                    class="app-btn app-btn-ghost text-sm">Cancel</button>
            <button type="submit" class="app-btn app-btn-primary text-sm">Save</button>
        </div>
    </form>
</div>
